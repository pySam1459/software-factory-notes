[project]
name = "ai-friendly-python-example"
version = "0.1.0"
description = "Minimal FastAPI layout with one way to add an endpoint."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2",
    "pyright>=1.1.390",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["scripts/templates"]

[tool.ruff.lint]
ignore = ["E501"]
select = [
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "DTZ",
    "E",
    "ERA",
    "F",
    "I",
    "N",
    "PGH",
    "PIE",
    "PLW0603",
    "RET",
    "RUF",
    "S102",
    "S307",
    "SIM",
    "T20",
    "TID",
    "UP",
    "W",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"aiohttp".msg = "Use httpx."
"attr".msg = "Use pydantic."
"attrs".msg = "Use pydantic."
"collections.namedtuple".msg = "Use a pydantic model."
"logging.getLogger".msg = "Use app.log.get_logger."
"os.path".msg = "Use pathlib.Path."
"requests".msg = "Use httpx."
"unittest".msg = "Use pytest."
"unittest.mock".msg = "Inject a fake through the repository Protocol. Do not monkeypatch."
"urllib".msg = "Use httpx."
"urllib.request".msg = "Use httpx."

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"scripts/new_endpoint.py" = ["T201"]
"src/app/log.py" = ["TID251"]
"tests/**" = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests", "scripts"]
exclude = ["scripts/templates", ".venv"]
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]
anyio_mode = "auto"

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "API on services on repositories on models"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.models",
]

[[tool.importlinter.contracts]]
name = "API does not reach into repositories"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.repositories"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "SQL drivers stay in repositories"
type = "forbidden"
source_modules = ["app.api", "app.services", "app.models"]
forbidden_modules = ["sqlite3", "psycopg", "psycopg2"]
